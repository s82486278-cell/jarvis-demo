<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AERIS</title>

<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aeris">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="grid-bg"></div>

  <div class="hud" id="voiceScreen">
    <header class="topbar">
      <div class="brand">
        <button class="top-menu-btn" id="topMenuBtn" title="Menú">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
        </button>
      </div>
      <div class="readouts">
        <div class="readout"><span class="k">MEMORIA</span><span class="v" id="memStatus">—</span></div>
        <div class="readout"><span class="k">HORA</span><span class="v" id="clock">--:--</span></div>
      </div>
    </header>

    <main class="stage">
      <div class="orb-wrap">
        <canvas id="orbCanvas" width="480" height="480"></canvas>
        <div class="orb-ring"></div>
      </div>

      <div class="status" id="status">EN ESPERA</div>

      <button class="install-btn" id="installBtn" hidden>
        <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M5 20h14v-2H5v2zM12 2v12.17l3.59-3.58L17 12l-5 5-5-5 1.41-1.41L11 14.17V2h1z"/></svg>
        Instalar app
      </button>

      <div class="controls">
        <button class="talk-btn" id="talkBtn">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-2.08A7 7 0 0019 12h-2z"/></svg>
          <span id="talkBtnLabel">Toca para hablar</span>
        </button>
        <div class="icon-row">
          <button class="chat-toggle" id="chatToggle" title="Abrir chat de texto">
            <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M4 4h16a1 1 0 011 1v11a1 1 0 01-1 1H8l-4 4V6a1 1 0 011-1z"/></svg>
          </button>
          <button class="replay-voice-btn" id="replayVoiceBtn" hidden title="Repetir la última respuesta">
            <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M12 5V1L7 6l5 5V7a5 5 0 11-5 5H5a7 7 0 107-7z"/></svg>
          </button>
        </div>
      </div>
    </main>
  </div>

  <div class="chat-screen" id="chatScreen">
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <aside class="sidebar" id="sidebar">
      <button class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 24 24" width="15" height="15"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
        <span>Nueva conversación</span>
      </button>
      <div class="conv-list" id="convList"></div>
      <div class="sidebar-bottom">
        <button class="sidebar-btn" id="settingsBtn" title="Configuración">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm8.94 3a7.95 7.95 0 00-.14-1.5l2.11-1.65-2-3.46-2.49 1a8.03 8.03 0 00-2.6-1.5l-.38-2.64h-4l-.38 2.64a8.03 8.03 0 00-2.6 1.5l-2.49-1-2 3.46 2.11 1.65a7.95 7.95 0 000 3l-2.11 1.65 2 3.46 2.49-1a8.03 8.03 0 002.6 1.5l.38 2.64h4l.38-2.64a8.03 8.03 0 002.6-1.5l2.49 1 2-3.46-2.11-1.65c.09-.5.14-1 .14-1.5z"/></svg>
        </button>
        <button class="sidebar-btn" id="logoutBtn" title="Cerrar sesión">
          <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M16 13v-2H7V8l-5 4 5 4v-3zM20 3H10a1 1 0 00-1 1v4h2V5h8v14h-8v-3H9v4a1 1 0 001 1h10a1 1 0 001-1V4a1 1 0 00-1-1z"/></svg>
        </button>
        <button class="back-to-voice-btn" id="backToVoice" title="Volver a la voz">
          <svg viewBox="0 0 24 24" width="17" height="17"><path fill="currentColor" d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3zm5-3a5 5 0 01-10 0H5a7 7 0 006 6.92V21h2v-2.08A7 7 0 0019 12h-2z"/></svg>
        </button>
      </div>
    </aside>

    <div class="chat-main">
      <div class="chat-mobile-header">
        <button class="menu-btn" id="menuBtn" title="Conversaciones">
          <svg viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M4 6h16v2H4V6zm0 5h16v2H4v-2zm0 5h16v2H4v-2z"/></svg>
        </button>
      </div>
      <div class="thread" id="thread"></div>
      <div class="stop-speaking-bar" id="stopSpeakingBar" hidden>
        <button class="stop-speaking-btn" id="stopSpeakingBtn">
          <svg viewBox="0 0 24 24" width="13" height="13"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>
          Detener voz
        </button>
      </div>
      <form class="composer" id="composer">
        <input type="text" id="input" placeholder="Escribe un mensaje…" autocomplete="off" />
        <button type="submit" class="send-btn">Enviar</button>
      </form>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <h2>Configuración</h2>

      <label class="modal-label">Nombre del asistente</label>
      <input type="text" id="assistantNameInput" placeholder="Aeris" />

      <label class="modal-label">¿Cómo quieres que te llame?</label>
      <input type="text" id="userNameInput" placeholder="Tu nombre o apodo (opcional)" />

      <label class="modal-label">Tema</label>
      <div class="theme-toggle-row">
        <button type="button" class="theme-opt" data-theme-choice="dark">Oscuro</button>
        <button type="button" class="theme-opt" data-theme-choice="light">Claro</button>
      </div>

      <label class="modal-label">Color de acento</label>
      <div class="accent-row">
        <button type="button" class="accent-swatch" data-accent-choice="cyan" style="--sw:#00FFFF" title="Cian"></button>
        <button type="button" class="accent-swatch" data-accent-choice="pink" style="--sw:#FF2E9A" title="Rosa eléctrico"></button>
        <button type="button" class="accent-swatch" data-accent-choice="blue" style="--sw:#3D6BFF" title="Azul eléctrico"></button>
        <button type="button" class="accent-swatch" data-accent-choice="green" style="--sw:#39FF14" title="Verde fosforescente"></button>
        <button type="button" class="accent-swatch" data-accent-choice="purple" style="--sw:#B14EFF" title="Violeta neón"></button>
        <button type="button" class="accent-swatch" data-accent-choice="orange" style="--sw:#FF8A1E" title="Naranja eléctrico"></button>
      </div>

      <label class="modal-label">Voz</label>
      <select id="voiceSelect"></select>

      <label class="modal-label">Frase para despertar (opcional)</label>
      <input type="text" id="wakePhraseInput" placeholder='Ej. "Aeris despierta" o "Buenos días"' />

      <label class="modal-label">Música de fondo al despertar (link de YouTube)</label>
      <input type="text" id="youtubeInput" placeholder="Pega el link del video de YouTube" />

      <div class="modal-actions">
        <button class="modal-cancel" id="settingsCancel">Cancelar</button>
        <button class="modal-save" id="settingsSave">Guardar</button>
      </div>
    </div>
  </div>

  <div class="yt-player-wrap" id="ytPlayerWrap" hidden>
    <div id="ytPlayer"></div>
    <button class="yt-stop-btn" id="ytStopBtn" title="Detener música">
      <svg viewBox="0 0 24 24" width="14" height="14"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>
    </button>
  </div>

  <div class="modal-overlay" id="renameModal">
    <div class="modal-card">
      <h2>Cambiar nombre</h2>
      <label class="modal-label">Nombre de la conversación</label>
      <input type="text" id="renameInput" placeholder="Nueva conversación" />
      <div class="modal-actions">
        <button class="modal-cancel" id="renameCancel">Cancelar</button>
        <button class="modal-save" id="renameSave">Guardar</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="deleteModal">
    <div class="modal-card">
      <h2>Eliminar conversación</h2>
      <p class="modal-text">Esta acción no se puede deshacer. ¿Seguro que quieres eliminarla?</p>
      <div class="modal-actions">
        <button class="modal-cancel" id="deleteCancel">Cancelar</button>
        <button class="modal-save modal-danger" id="deleteConfirm">Continuar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
