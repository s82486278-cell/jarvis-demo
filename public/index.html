<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jarvis — Tu IA</title>
<style>
:root {
  --acento: #00d4ff;
  --acento-2: #7b2ff7;
  --glass-fondo: rgba(255, 255, 255, 0.08);
  --glass-borde: rgba(255, 255, 255, 0.18);
  --texto: #ffffff;
  --radio: 20px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: #05060f;
  color: var(--texto);
  min-height: 100vh;
  overflow-x: hidden;
}
/* ============ ESFERA (FONDO) ============ */
.orb {
  position: fixed;
  top: 50%; left: 50%;
  width: 440px; height: 440px;
  transform: translate(-50%, -55%);
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%,
    rgba(0, 212, 255, 0.85),
    rgba(123, 47, 247, 0.5) 45%,
    rgba(5, 10, 30, 0.95) 78%);
  box-shadow:
    0 0 140px rgba(0, 212, 255, 0.35),
    inset 0 0 90px rgba(123, 47, 247, 0.45);
  animation: orbPulse 6s ease-in-out infinite;
  z-index: 0;
}
.orb-ring {
  position: fixed;
  top: 50%; left: 50%;
  border-radius: 50%;
  border: 1px solid rgba(0, 212, 255, 0.25);
  transform: translate(-50%, -55%) rotateX(70deg);
  z-index: 0;
}
.ring1 { width: 560px; height: 560px; animation: spinRing 18s linear infinite; }
.ring2 { width: 660px; height: 660px; animation: spinRing 28s linear infinite reverse; border-color: rgba(123, 47, 247, 0.2); }
@keyframes orbPulse {
  0%, 100% { transform: translate(-50%, -55%) scale(1); filter: brightness(1); }
  50%      { transform: translate(-50%, -55%) scale(1.05); filter: brightness(1.2); }
}
@keyframes spinRing {
  from { transform: translate(-50%, -55%) rotateX(70deg) rotateZ(0deg); }
  to   { transform: translate(-50%, -55%) rotateX(70deg) rotateZ(360deg); }
}
.particle {
  position: fixed;
  border-radius: 50%;
  background: var(--acento);
  opacity: 0.5;
  animation: floatUp linear infinite;
  z-index: 0;
}
@keyframes floatUp {
  from { transform: translateY(105vh) scale(1); opacity: 0; }
  10%  { opacity: 0.5; }
  90%  { opacity: 0.3; }
  to   { transform: translateY(-5vh) scale(0.4); opacity: 0; }
}
/* ============ GLASS NAVBAR ============ */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 28px;
  background: rgba(10, 10, 25, 0.4);
  -webkit-backdrop-filter: blur(16px) saturate(160%);
  backdrop-filter: blur(16px) saturate(160%);
  border-bottom: 1px solid var(--glass-borde);
}
nav h1 {
  font-size: 20px;
  letter-spacing: 3px;
  background: linear-gradient(90deg, var(--acento), var(--acento-2));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
nav .estado {
  font-size: 12px;
  color: rgba(255,255,255,0.6);
  display: flex;
  align-items: center;
  gap: 6px;
}
.punto-verde {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #2eff8a;
  box-shadow: 0 0 10px #2eff8a;
  animation: parpadeo 2s infinite;
}
@keyframes parpadeo { 50% { opacity: 0.4; } }
/* ============ PANEL DE CHAT (VIDRIO) ============ */
.chat-panel {
  position: relative;
  z-index: 5;
  max-width: 720px;
  margin: 90px auto 30px;
  height: calc(100vh - 130px);
  display: flex;
  flex-direction: column;
  background: var(--glass-fondo);
  -webkit-backdrop-filter: blur(20px) saturate(180%);
  backdrop-filter: blur(20px) saturate(180%);
  border: 1px solid var(--glass-borde);
  border-radius: var(--radio);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
  overflow: hidden;
}
.chat-panel::before {
  content: "";
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 45%;
  background: linear-gradient(180deg, rgba(255,255,255,0.1), transparent);
  pointer-events: none;
}
.mensajes {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.mensajes::-webkit-scrollbar { width: 6px; }
.mensajes::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
.msg {
  max-width: 80%;
  padding: 12px 18px;
  line-height: 1.5;
  font-size: 15px;
  animation: aparecer 0.3s ease;
}
@keyframes aparecer {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.msg-ia {
  align-self: flex-start;
  background: rgba(255, 255, 255, 0.07);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  border: 1px solid var(--glass-borde);
  border-radius: 18px 18px 18px 4px;
}
.msg-usuario {
  align-self: flex-end;
  background: rgba(0, 212, 255, 0.15);
  border: 1px solid rgba(0, 212, 255, 0.35);
  border-radius: 18px 18px 4px 18px;
}
.msg img.imagen-gen {
  max-width: 100%;
  border-radius: 14px;
  display: block;
  margin-top: 8px;
}
.escribiendo {
  align-self: flex-start;
  padding: 14px 20px;
  display: none;
  gap: 5px;
}
.escribiendo span {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--acento);
  animation: saltar 1.2s infinite;
}
.escribiendo span:nth-child(2) { animation-delay: 0.15s; }
.escribiendo span:nth-child(3) { animation-delay: 0.3s; }
@keyframes saltar {
  0%, 60%, 100% { transform: translateY(0); }
  30% { transform: translateY(-8px); }
}
/* ============ INPUT (VIDRIO) ============ */
.input-bar {
  display: flex;
  gap: 10px;
  padding: 16px;
  border-top: 1px solid var(--glass-borde);
  background: rgba(255, 255, 255, 0.03);
  -webkit-backdrop-filter: blur(12px);
  backdrop-filter: blur(12px);
}
.input-bar input {
  flex: 1;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--glass-borde);
  border-radius: 999px;
  padding: 13px 22px;
  color: var(--texto);
  font-size: 15px;
  outline: none;
  transition: all 0.25s ease;
}
.input-bar input:focus {
  border-color: var(--acento);
  box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.2);
}
.input-bar input::placeholder { color: rgba(255,255,255,0.45); }
.input-bar button {
  background: linear-gradient(135deg, rgba(0,212,255,0.25), rgba(123,47,247,0.25));
  -webkit-backdrop-filter: blur(10px);
  backdrop-filter: blur(10px);
  border: 1px solid var(--glass-borde);
  border-radius: 999px;
  color: var(--texto);
  padding: 13px 26px;
  font-size: 15px;
  cursor: pointer;
  transition: all 0.25s ease;
}
.input-bar button:hover {
  border-color: var(--acento);
  box-shadow: 0 0 20px rgba(0, 212, 255, 0.35);
  transform: translateY(-1px);
}
@media (max-width: 640px) {
  .chat-panel { margin: 76px 10px 10px; height: calc(100vh - 90px); }
  .orb { width: 300px; height: 300px; }
  .ring1 { width: 380px; height: 380px; }
  .ring2 { width: 450px; height: 450px; }
  .chat-panel, nav {
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
  }
}
</style>
</head>
<body>

<div class="orb"></div>
<div class="orb-ring ring1"></div>
<div class="orb-ring ring2"></div>

<nav>
  <h1>J.A.R.V.I.S</h1>
  <div class="estado"><span class="punto-verde"></span> En línea</div>
</nav>

<main class="chat-panel">
  <div class="mensajes" id="mensajes">
    <div class="msg msg-ia">Hola 👋 Soy Jarvis. Puedo conversar contigo o <b>generar imágenes</b> — prueba diciendo: <i>"genera una imagen de un dragón cyberpunk"</i></div>
  </div>

  <div class="escribiendo" id="escribiendo">
    <span></span><span></span><span></span>
  </div>

  <div class="input-bar">
    <input type="text" id="entrada" placeholder="Escribe tu mensaje o pide una imagen..." autocomplete="off">
    <button onclick="enviar()">Enviar ➤</button>
  </div>
</main>

<script>
const CONFIG = {
  BACKEND_URL: "",              // "" = mismo dominio. Si el front está en otro lado, pon la URL de Railway
  CHAT_ENDPOINT: "/api/chat",
  IMAGE_ENDPOINT: "/api/generar-imagen",
};

let historial = [];

const mensajesDiv = document.getElementById("mensajes");
const entrada = document.getElementById("entrada");
const escribiendo = document.getElementById("escribiendo");

entrada.addEventListener("keydown", (e) => { if (e.key === "Enter") enviar(); });

function agregarMensaje(texto, tipo) {
  const div = document.createElement("div");
  div.className = "msg " + tipo;
  div.innerHTML = texto;
  mensajesDiv.appendChild(div);
  mensajesDiv.scrollTop = mensajesDiv.scrollHeight;
  return div;
}

function agregarImagen(srcData) {
  const div = document.createElement("div");
  div.className = "msg msg-ia";
  div.innerHTML = `🎨 Aquí tienes tu imagen:<br><img class="imagen-gen" src="${srcData}">`;
  mensajesDiv.appendChild(div);
  mensajesDiv.scrollTop = mensajesDiv.scrollHeight;
}

function mostrarEscribiendo(visible) {
  escribiendo.style.display = visible ? "flex" : "none";
  if (visible) mensajesDiv.scrollTop = mensajesDiv.scrollHeight;
}

async function enviar() {
  const texto = entrada.value.trim();
  if (!texto) return;
  entrada.value = "";

  agregarMensaje(texto, "msg-usuario");
  mostrarEscribiendo(true);

  const pideImagen = /(genera|crea|haz|dibuja).*(imagen|foto|ilustraci[oó]n|picture)/i.test(texto);

  try {
    if (pideImagen) {
      const prompt = texto.replace(/(genera|crea|haz|dibuja)(me)?( una)?( imagen| foto| ilustraci[oó]n)?( de)?/i, "").trim();
      const res = await fetch(CONFIG.BACKEND_URL + CONFIG.IMAGE_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ prompt }),
      });
      const data = await res.json();
      mostrarEscribiendo(false);
      if (data.imagen) agregarImagen(data.imagen);
      else agregarMensaje("❌ No pude generar la imagen. Intenta de nuevo.", "msg-ia");
    } else {
      historial.push({ role: "user", parts: [{ text: texto }] });
      const res = await fetch(CONFIG.BACKEND_URL + CONFIG.CHAT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mensajes: historial }),
      });
      const data = await res.json();
      mostrarEscribiendo(false);
      if (data.respuesta) {
        historial.push({ role: "model", parts: [{ text: data.respuesta }] });
        agregarMensaje(data.respuesta.replace(/\n/g, "<br>"), "msg-ia");
      } else {
        agregarMensaje("❌ Error al responder. Revisa tu backend.", "msg-ia");
      }
    }
  } catch (error) {
    mostrarEscribiendo(false);
    agregarMensaje("❌ Error de conexión: " + error.message, "msg-ia");
  }
}

/* Partículas flotantes */
for (let i = 0; i < 25; i++) {
  const p = document.createElement("div");
  p.className = "particle";
  const size = Math.random() * 3 + 1;
  p.style.width = size + "px";
  p.style.height = size + "px";
  p.style.left = Math.random() * 100 + "vw";
  p.style.animationDuration = Math.random() * 12 + 8 + "s";
  p.style.animationDelay = Math.random() * 12 + "s";
  p.style.background = Math.random() > 0.5 ? "var(--acento)" : "var(--acento-2)";
  document.body.appendChild(p);
}
</script>
</body>
</html>
